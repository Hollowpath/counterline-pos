name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package
        run: sh ./mvnw -B verify

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  image:
    name: Packaged image scan and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t counterline-pos:local .

      # Installs the same Trivy release the action used to install itself (v0.70.0), but separately, so a failed download
      # is visible and retried. The release tarball is pinned by SHA-256 (the value in the release's own checksums file
      # and in the GitHub release API); a download that does not match is rejected and never executed. The installer
      # inside the action (a script that downloads two files and exits silently on failure) is skipped below.
      - name: Install Trivy (pinned, checksum-verified)
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -u
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          archive="${RUNNER_TEMP}/${asset}"
          ok=""
          for attempt in 1 2 3 4 5; do
            rm -f "$archive"
            rc=0
            code=$(curl -sS -L --connect-timeout 15 --max-time 180 -w '%{http_code}' -o "$archive" "$url") || rc=$?
            actual=""
            [ -s "$archive" ] && actual=$(sha256sum "$archive" | cut -d' ' -f1)
            echo "attempt ${attempt}/5: curl exit ${rc}, HTTP ${code:-none}, bytes $( [ -f "$archive" ] && wc -c < "$archive" || echo 0 ), sha256 ${actual:-none}"
            if [ "$rc" -eq 0 ] && [ "$code" = "200" ] && [ "$actual" = "$TRIVY_SHA256" ]; then
              ok=1
              break
            fi
            [ -n "$actual" ] && [ "$actual" != "$TRIVY_SHA256" ] && echo "checksum mismatch: expected ${TRIVY_SHA256}"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
          done
          if [ -z "$ok" ]; then
            echo "::error title=Trivy download failed::${asset} could not be downloaded and verified from ${url} after 5 attempts (see the attempt lines above)."
            exit 1
          fi
          mkdir -p "${HOME}/.local/bin/trivy-bin"
          tar -xzf "$archive" -C "${HOME}/.local/bin/trivy-bin" trivy
          echo "${HOME}/.local/bin/trivy-bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/trivy-bin/trivy" --version

      # Scans the image built above (not rebuilt): OS packages and application libraries. Only
      # vulnerabilities with a fix available at HIGH or CRITICAL severity fail the job.
      - name: Scan the image for vulnerabilities
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: counterline-pos:local
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the Compose app profile
        run: docker compose --profile app up --no-build -d

      - name: Wait for the application to report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8090/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "The application did not become healthy within 180 seconds" >&2
          exit 1

      # End-to-end smoke tests against the Compose app started above (the packaged image).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end smoke tests
        working-directory: frontend
        run: npm run test:e2e

      # Only when the scan passed and a later Compose step failed: not for checkout, build or scan failures.
      - name: Show container status and logs
        if: failure() && steps.trivy.conclusion == 'success'
        run: |
          docker compose --profile app ps -a
          docker compose --profile app logs --no-color --tail=200 app app-db

      - name: Stop and remove the containers
        if: always()
        run: docker compose --profile app down --volumes
