name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package
        run: sh ./mvnw -B verify

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  image:
    name: Packaged image scan and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t counterline-pos:local .

      # Scans the image built above (not rebuilt): OS packages and application libraries. Only
      # vulnerabilities with a fix available at HIGH or CRITICAL severity fail the job.
      - name: Scan the image for vulnerabilities
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: counterline-pos:local
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the Compose app profile
        run: docker compose --profile app up --no-build -d

      - name: Wait for the application to report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8090/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "The application did not become healthy within 180 seconds" >&2
          exit 1

      # End-to-end smoke tests against the Compose app started above (the packaged image).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end smoke tests
        working-directory: frontend
        run: npm run test:e2e

      # Only when the scan passed and a later Compose step failed: not for checkout, build or scan failures.
      - name: Show container status and logs
        if: failure() && steps.trivy.conclusion == 'success'
        run: |
          docker compose --profile app ps -a
          docker compose --profile app logs --no-color --tail=200 app app-db

      - name: Stop and remove the containers
        if: always()
        run: docker compose --profile app down --volumes
